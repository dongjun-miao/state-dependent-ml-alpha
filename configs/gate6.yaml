neutralization:
  timing: before_execution_fill
  method: "Support-preserving least-squares projection of raw weights onto the orthogonal complement of the constraint matrix."
  constraints:
    - beta_252d
    - log_lagged_market_cap
    - industry_division_0_to_9_plus_missing
  continuous_standardization: same_date_primary_universe_zscore
  continuous_missing_value: same_date_median_then_zscore
  target_tolerance: 1.0e-8
  post_fill_reoptimization: false

realized_returns:
  source: canonical_v1_return_total
  valid_delisting: "Apply the terminal total return, then hold proceeds as cash."
  missing_or_invalid_held_return_primary: "Apply a conservative -100% terminal-value convention at the first missing/invalid held return, then hold cash."
  missing_or_invalid_held_return_sensitivity: "Apply a 0% terminal-value convention at the first missing/invalid held return, then hold cash."
  warning: "The -100% and 0% paths are explicit missing-terminal-value bounds/conventions, not estimated realized returns."
  dataset_end: "Do not form a cohort unless all ten return sessions exist in the fixed market calendar."

turnover_and_costs:
  one_way_turnover: "0.5 * L1 change in aggregate risky weights at each close, netting simultaneous scheduled cohort entries and exits by security."
  include_entry_and_scheduled_exit: true
  terminal_cash_conversion_is_trade: false
  cost_application: "net_return = gross_return - 2 * one_way_turnover * one_way_cost_bps / 10000"
  one_way_cost_bps: [5, 10, 20, 30]
  break_even_bps: "10000 * mean_daily_gross_return / (2 * mean_daily_one_way_turnover)"
  realized_cost_claim_allowed: false

